<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road to 100</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBEF; --surface:#FFFFFF; --sunk:#F2F4F7; --ink:#1B2230; --muted:#5D6778; --line:#D2D7DF;
  --red:#C8243A; --blue:#1F5BAA; --yellow:#C99700; --green:#23845A; --grey:#8A93A1;
  --tint-red:#FBE8EB; --tint-blue:#E6EEF9; --tint-yellow:#FBF3DA; --tint-green:#E3F3EB; --tint-grey:#EEF0F3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15191F; --surface:#1E232B; --sunk:#191D24; --ink:#EDF0F4; --muted:#9AA3B2; --line:#2F3641;
    --red:#F0566A; --blue:#6A9DEB; --yellow:#F2C230; --green:#46B581; --grey:#7D8696;
    --tint-red:#3A1F25; --tint-blue:#1C2A40; --tint-yellow:#3A321A; --tint-green:#1B3429; --tint-grey:#252B34;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15191F; --surface:#1E232B; --sunk:#191D24; --ink:#EDF0F4; --muted:#9AA3B2; --line:#2F3641;
  --red:#F0566A; --blue:#6A9DEB; --yellow:#F2C230; --green:#46B581; --grey:#7D8696;
  --tint-red:#3A1F25; --tint-blue:#1C2A40; --tint-yellow:#3A321A; --tint-green:#1B3429; --tint-grey:#252B34;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:84px}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 24px}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
h2{font-size:26px;font-weight:700;margin:26px 0 10px;line-height:1.1}
h3{font-size:20px;font-weight:700;margin:0 0 6px}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
button{font:inherit;color:inherit}
input[type=number]{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:76px;text-align:right}
input:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* hero */
.hero{padding:6px 0 4px}
.hero h1{font-size:54px;font-weight:800;line-height:.9;margin:0;letter-spacing:-.5px}
.hero .line{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:15px;color:var(--muted)}
.hero .line b{color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;margin-right:4px}
.bar{width:100%;height:auto;display:block;margin:10px 0 4px}

/* day header */
.daynav{display:flex;align-items:center;gap:8px;margin:18px 0 10px}
.daynav button{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:22px;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
.daynav .todaybtn{width:auto;padding:0 14px;font-size:15px;font-weight:600}
.daynav .date{flex:1;min-width:0}
.daynav .date .d{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700;line-height:1}
.daynav .date .w{font-size:13px;color:var(--muted)}

.type{border-left:8px solid var(--c);background:var(--surface);border-radius:14px;padding:14px 14px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.type .n{font-family:"Barlow Condensed",sans-serif;font-size:32px;font-weight:800;line-height:1;color:var(--c)}
.type .s{font-size:15px;color:var(--muted);margin-top:2px}
.ring{width:62px;height:62px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.fact{background:var(--surface);border-radius:12px;padding:10px}
.fact b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;line-height:1.05}
.fact span{font-size:13px;color:var(--muted)}
.banner{background:var(--tint-green);border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:500}

.card{background:var(--surface);border-radius:14px;padding:14px;margin-top:10px}
.card.tinted{background:var(--tint)}
.sec{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;margin:20px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-family:"Barlow",sans-serif;font-size:13px;font-weight:500;color:var(--muted)}

/* bench */
.bench{border:2px solid var(--c);background:var(--surface);border-radius:16px;padding:14px;margin-top:10px}
.bench .top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.bench .kg{font-family:"Barlow Condensed",sans-serif;font-size:64px;font-weight:800;line-height:.85;color:var(--c)}
.bench .kg small{font-size:26px;margin-left:2px}
.bench .sr{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;line-height:1}
.bench .meta{font-size:14px;color:var(--muted);margin-top:8px}
.note{background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:10px}
.attempts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.attempts div{background:var(--sunk);border-radius:10px;padding:8px;text-align:center}
.attempts b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:30px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--sunk);border-radius:999px;padding:4px 10px;font-size:14px}

/* task rows */
.row{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .nm{font-weight:600;line-height:1.25}
.row .dt{font-size:14px;color:var(--muted)}
.row .wt{text-align:right}
.row .wt .p{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;line-height:1}
.row .wt .p small{font-size:14px}
.row .wt a{font-size:13px;color:var(--blue);cursor:pointer;text-decoration:underline}
.row .log{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:4px;font-size:12px;color:var(--muted)}
.row .log input{width:60px;padding:3px 6px;font-size:14px}
.row .wt .first{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:700;line-height:1.1}
.row .wt .last{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px;background:var(--sunk);color:var(--muted)}

.tick{appearance:none;-webkit-appearance:none;width:30px;height:30px;border:2px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;display:grid;place-content:center;margin:0}
.tick::after{content:"";width:12px;height:7px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.tick:checked{background:var(--green);border-color:var(--green)}
.tick:checked::after{opacity:1}
.tick:checked{animation:pop .18s ease-out}
@keyframes pop{50%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.tick:checked{animation:none}}
.done .nm{text-decoration:line-through;text-decoration-color:var(--muted)}

/* plan */
.week{background:var(--surface);border-radius:14px;padding:12px;margin-top:10px}
.week .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.week .h b{font-family:"Barlow Condensed",sans-serif;font-size:21px}
.week .h span{font-size:13px;color:var(--muted);text-align:right}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.dchip{border:0;border-radius:9px;padding:6px 0 5px;text-align:center;cursor:pointer;background:var(--tint-grey);color:var(--ink);line-height:1.05}
.dchip .dn{font-size:11px;color:var(--muted)}
.dchip .dd{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700}
.dchip .dt{font-size:11px;font-weight:700}
.dchip.full{background:var(--c);color:#fff}
.dchip.full .dn{color:rgba(255,255,255,.85)}
.dchip.gym{box-shadow:inset 0 -4px 0 var(--c)}
.dchip.today{outline:2px solid var(--ink);outline-offset:1px}
.dchip.empty{visibility:hidden}
.wk-info{font-size:14px;color:var(--muted);margin-top:8px}

/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border-radius:14px;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px;background:var(--surface)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.sheet th:first-child,.sheet td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;white-space:normal;min-width:150px;max-width:170px;box-shadow:1px 0 0 var(--line)}
.sheet td.deload,.sheet th.deload{background:var(--tint-yellow)}
.sheet td.off{color:var(--line)}
.sheet .exn{font-weight:600;line-height:1.2;font-size:14px}
.sheet .exm{font-size:12px;color:var(--muted)}
.sheet input{width:62px;margin-top:4px;font-size:14px;padding:4px 6px}
.bt td:first-child{font-weight:600}
.field{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field label{font-weight:600}
.field .hint{display:block;font-size:13px;color:var(--muted);font-weight:400}
.btn{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.danger{color:var(--red)}
.txt{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:3px 0}
ol{margin:6px 0 0;padding-left:22px}
ol li{margin:4px 0}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:10px 0 12px;font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--red)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in" role="tablist">
  <button role="tab" data-tab="today">Today</button>
  <button role="tab" data-tab="plan">Plan</button>
  <button role="tab" data-tab="weights">Weights</button>
  <button role="tab" data-tab="weighin">Weigh-in</button>
  <button role="tab" data-tab="food">Food</button>
</div></nav>

<script>
/* ---------- dates ---------- */
const START = new Date(2026,9,1), END = new Date(2026,11,31), W1 = new Date(2026,9,5);
const DAY = 86400000;
const addDays = (d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const dayDiff = (a,b)=>Math.round((new Date(a.getFullYear(),a.getMonth(),a.getDate()) - new Date(b.getFullYear(),b.getMonth(),b.getDate()))/DAY);
const key = d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseKey = k=>{const [y,m,dd]=k.split('-').map(Number);return new Date(y,m-1,dd);};
const weekIdx = d=>{const n=dayDiff(d,W1);return n<0?0:Math.floor(n/7)+1;};
const monthKey = d=>['oct','nov','dec'][d.getMonth()-9];
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = d=>DN[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()];
const ALL = [];for(let d=new Date(START);d<=END;d=addDays(d,1))ALL.push(new Date(d));
const TEST_KEY='2026-12-28';

function dayType(d){
  if(key(d)===TEST_KEY) return 'T';
  // starter week (1 to 4 Oct): Fri lower, Sat practice bench
  if(weekIdx(d)===0) return ({5:'L',6:'C'})[d.getDay()]||'R';
  // from Mon 5 Oct: Mon Upper A, Tue Lower A, Wed Upper B, Fri Upper C, Sat Lower B
  return ({1:'A',2:'L',3:'B',5:'C',6:'N'})[d.getDay()]||'R';
}
const isLeg = t=>t==='L'||t==='N';
const TYPES={
  A:{name:'Upper A',sub:'Heavy bench, chest, back, arms',c:'var(--red)',t:'var(--tint-red)'},
  B:{name:'Upper B',sub:'Volume bench, shoulders, back, arms',c:'var(--blue)',t:'var(--tint-blue)'},
  L:{name:'Lower A',sub:'Legs, calves and abs',c:'var(--yellow)',t:'var(--tint-yellow)'},
  N:{name:'Lower B',sub:'Legs, calves and abs',c:'var(--yellow)',t:'var(--tint-yellow)'},
  C:{name:'Upper C',sub:'Paused bench, back, shoulders, arms',c:'var(--green)',t:'var(--tint-green)'},
  T:{name:'Test day',sub:'Your 1 rep max attempt',c:'var(--red)',t:'var(--tint-red)'},
  R:{name:'Rest day',sub:'Steps, food and sleep',c:'var(--grey)',t:'var(--tint-grey)'}
};

/* ---------- exercises ---------- */
// kind: M machine/cable, D dumbbell (weight per dumbbell), B barbell.
// T: where a consistent beginner (about 83 kg) can get by late December, in kg. jump: weekly jump if bigger than the kit's smallest step.
// Steps match real gym kit: dumbbells come in 2.5 kg jumps, barbells load in 2.5 kg steps, machine stacks move in 5 kg plates.
const EX={
  chestpress:{n:'Chest press machine',k:'M',rest:90,T:70},
  latpd:{n:'Lat pulldown machine',k:'M',rest:90,T:65},
  rowmach:{n:'Seated row machine',k:'M',rest:90,T:65},
  shpress:{n:'Seated shoulder press machine',k:'M',rest:90,T:50},
  pecdeck:{n:'Pec deck',k:'M',rest:60,T:60},
  inclinedb:{n:'Incline dumbbell press',k:'D',rest:90,T:25},
  dblat:{n:'Dumbbell lateral raise',k:'D',rest:60,T:10},
  cablecurl:{n:'Cable biceps curl',k:'M',rest:60,T:30},
  pushdown:{n:'Cable triceps pushdown',k:'M',rest:60,T:35},
  crunch:{n:'Cable crunch',k:'M',rest:60,T:80},
  legpress:{n:'Seated leg press',k:'M',rest:90,T:120},
  bbrdl:{n:'Barbell Romanian deadlift',k:'B',rest:90,T:90,jump:5},
  legcurl:{n:'Seated leg curl',k:'M',rest:60,T:50},
  legext:{n:'Leg extension',k:'M',rest:60,T:50},
  dbcalf:{n:'Dumbbell calf raise',k:'D',rest:60,T:25},
  goblet:{n:'Goblet squat',k:'D',rest:90,T:32.5}
};
const KIND={M:'Machine',D:'Dumbbell',B:'Barbell'};
// smallest real jump: dumbbells and barbells 2.5 kg, machine stacks 5 kg
const STEP={M:5,D:2.5,B:2.5};
const snap=(id,kg)=>{const st=STEP[EX[id].k];return Math.max(st,Math.round(kg/st)*st);};
// starter week (1 to 4 Oct) keeps the original sessions
const PLAN0={
  L:[['goblet',3,10],['bbrdl',3,10],['legpress',3,10],['legcurl',3,12],['legext',3,12],['crunch',3,15]],
  C:[['pecdeck',3,12],['latpd',3,12],['shpress',3,12],['pushdown',3,12],['crunch',3,15]]
};
// from Mon 5 Oct: [exercise, sets, reps]. Lower A is the heavier leg day, Lower B the higher-rep one.
const PLAN={
  A:[['chestpress',3,10],['latpd',3,10],['rowmach',3,10],['inclinedb',2,12],['cablecurl',3,12],['pushdown',3,12],['crunch',3,15]],
  L:[['legpress',4,10],['bbrdl',3,8],['legcurl',4,12],['legext',3,12],['dbcalf',3,15],['crunch',3,15]],
  B:[['shpress',3,10],['latpd',3,10],['rowmach',3,10],['dblat',3,15],['cablecurl',3,12],['pushdown',3,12],['crunch',3,15]],
  C:[['latpd',3,10],['rowmach',3,10],['shpress',2,12],['inclinedb',2,12],['cablecurl',2,12],['pushdown',2,12],['crunch',3,15]],
  N:[['legpress',4,12],['bbrdl',3,10],['legcurl',4,10],['legext',3,15],['dbcalf',3,15],['crunch',3,15]]
};
const exercisesFor = d=>(weekIdx(d)===0?PLAN0:PLAN)[dayType(d)]||[];

// first week each exercise appears, and which weeks it is used
const FIRST={}, USED={}, ORDER=[];
ALL.forEach(d=>{exercisesFor(d).forEach(([id])=>{const w=weekIdx(d);if(!(id in FIRST))FIRST[id]=w;(USED[id]=USED[id]||new Set()).add(w);if(w>0&&!ORDER.includes(id))ORDER.push(id);});});

/* ---------- bench ---------- */
// Bench plan, weights at a 70 kg 1RM (scaled by the 1RM setting). wu: warm-up [kg, reps].
// A: Monday top single then back-off 3x3. B: Wednesday volume. C: Friday paused.
const W1A=[[20,8],[30,5],[40,3]], W2=[[20,8],[30,5]], W3=[[20,8],[35,5]];
const BENCH={
  0:{C:{wu:null,sets:3,reps:8,kg:40}},
  1:{A:{wu:[...W1A,[50,1]],top:65,sets:3,reps:3,kg:50},B:{wu:[...W2,[35,2]],sets:3,reps:8,kg:40},C:{wu:[...W2,[37.5,2]],sets:3,reps:5,kg:42.5}},
  2:{A:{wu:[...W1A,[50,1]],top:67.5,sets:3,reps:3,kg:52.5},B:{wu:[...W2,[37.5,2]],sets:3,reps:8,kg:42.5},C:{wu:[...W2,[40,2]],sets:3,reps:5,kg:45}},
  3:{A:{wu:[...W1A,[52.5,1]],top:70,sets:3,reps:3,kg:55},B:{wu:[...W2,[40,2]],sets:3,reps:8,kg:45},C:{wu:[...W2,[42.5,2]],sets:3,reps:5,kg:47.5}},
  4:{A:{wu:[...W1A,[52.5,1]],top:72.5,sets:3,reps:3,kg:57.5},B:{wu:[...W2,[42.5,2]],sets:3,reps:8,kg:47.5},C:{wu:[...W2,[45,2]],sets:3,reps:5,kg:50}},
  5:{A:{wu:[...W1A,[55,1]],top:75,sets:3,reps:3,kg:60},B:{wu:[...W2,[45,2]],sets:3,reps:8,kg:50},C:{wu:[...W2,[47.5,2]],sets:3,reps:5,kg:52.5}},
  6:{A:{wu:[...W1A,[55,1]],top:77.5,sets:3,reps:3,kg:62.5},B:{wu:[...W2,[47.5,2]],sets:3,reps:8,kg:55},C:{wu:[...W2,[50,2]],sets:3,reps:5,kg:55}},
  7:{A:{wu:[...W1A,[57.5,1]],top:80,sets:3,reps:3,kg:65},B:{wu:[...W2,[50,2]],sets:3,reps:8,kg:57.5},C:{wu:[...W2,[52.5,2]],sets:3,reps:5,kg:60}},
  8:{A:{wu:[...W1A,[60,1]],top:82.5,sets:3,reps:3,kg:67.5},B:{wu:[...W3,[50,2]],sets:3,reps:8,kg:60},C:{wu:[...W2,[55,2]],sets:3,reps:5,kg:65}},
  9:{A:{wu:[...W1A,[60,1]],top:85,sets:3,reps:3,kg:70},B:{wu:[...W3,[52.5,2]],sets:3,reps:8,kg:62.5},C:{wu:[...W3,[55,2]],sets:3,reps:5,kg:67.5}},
  10:{A:{wu:[...W1A,[62.5,1]],top:87.5,sets:3,reps:3,kg:75},B:{wu:[...W3,[55,2]],sets:3,reps:8,kg:65},C:{wu:[...W3,[60,2]],sets:3,reps:5,kg:72.5}},
  11:{A:{wu:[...W1A,[65,1]],top:92.5,sets:3,reps:3,kg:80},B:{wu:[...W3,[60,2]],sets:3,reps:8,kg:70},C:{wu:[[20,8],[40,5],[60,2]],sets:3,reps:5,kg:77.5}},
  12:{A:{wu:[...W1A,[60,1],[70,1],[80,1],[90,1]],top:97.5,sets:3,reps:3,kg:85,bench:true},B:{wu:[...W3,[60,2]],sets:3,reps:8,kg:75},C:{wu:[[20,8],[40,5],[60,2],[70,1]],sets:3,reps:5,kg:80}}
};
// 1RM test, Mon 28 Dec, at a 100 kg target (scaled by the target setting)
const TEST_WU=[[20,8],[40,5],[50,3],[60,2],[70,1],[80,1],[87.5,1],[92.5,1],[97.5,1]];
const BREST={A:180,B:120,C:150};
const r25 = x=>Math.round(x/2.5)*2.5;
function benchFor(d){
  const t=dayType(d), w=weekIdx(d), s=S.settings;
  if(t==='T'){
    const f=s.target/100;
    return {test:true,wu:TEST_WU.map(([kg,r])=>[Math.max(20,r25(kg*f)),r]),top:r25(s.target),rest:240};
  }
  const row=BENCH[w]&&BENCH[w][t]; if(!row) return null;
  const sc=x=>Math.max(20,r25(x*s.oneRM/70));
  const b={wu:row.wu?row.wu.map(([kg,r])=>[sc(kg),r]):null,top:row.top?sc(row.top):null,sets:row.sets,reps:row.reps,kg:sc(row.kg),rest:BREST[t],paused:t==='C'&&w>0,benchmark:!!row.bench,notes:[]};
  if(w===0){b.wu=benchWarm(b.kg);b.notes.push('Practice day. Normal bench, no pause. Keep your shoulder blades pinned and lower the bar slowly to your lower chest.');b.rest=120;}
  if(b.top)b.notes.push(b.benchmark?'Benchmark week. If '+b.top+' kg moves well, 100 is on for test day. Use the safety arms or a spotter.':'Heavy single: one rep only, then drop to the back-off sets. Use the safety arms or a spotter.');

}

// Oct and Nov used to be dumbbell RDL, so any weight already saved under that name still counts.
const ALIAS={bbrdl:'dbrdl'};
const num=v=>{const x=parseFloat(v);return isNaN(x)?null:x;};
const startOf=id=>{let v=num(S.start[id]);if(v===null&&ALIAS[id])v=num(S.start[ALIAS[id]]);return v;};
const logOf=(k,id)=>{const l=S.days[k]&&S.days[k].log;if(!l)return null;let v=num(l[id]);if(v===null&&ALIAS[id])v=num(l[ALIAS[id]]);return v;};
// the most recent weight actually lifted before day key k
function lastLog(id,k){let best=null;for(const dk in S.days){if(dk<k){const v=logOf(dk,id);if(v!==null&&(!best||dk>best.k))best={k:dk,kg:v};}}return best;}
// share of the way to December's target reached by week w: beginners move fastest in the first weeks
function F(id,w){const f=Math.max(FIRST[id],1),N=13-f,n=Math.min(Math.max(0,w-f),N);return N<=0?1:(1-Math.exp(-n/8))/(1-Math.exp(-N/8));}
// weight to use in week w: builds on the last weight lifted (before day key k), or on the start weight.
// Climbs toward the December target and never stays the same for more than 3 weeks.
function planned(id,w,k){
  const L=lastLog(id,k); let a,base;
  if(L){a=weekIdx(parseKey(L.k));base=snap(id,L.kg);}
  else{const st=startOf(id);if(st===null)return null;a=FIRST[id];base=snap(id,st);}
  const e=EX[id], j=e.jump||STEP[e.k], Fa=F(id,a);
  // aim for the target, but always at least 20% up and never more than 3x where you started.
  // Lifts that only start in Nov or Dec get a matching share of the gain.
  const span=Math.min(1,(13-Math.max(FIRST[id],1))/12);
  const T=base+(Math.min(Math.max(e.T,base*1.2),base*3)-base)*span;
  let kg=base,run=1;
  for(let x=a+1;x<=w;x++){
    if(!USED[id].has(x))continue;
    const raw=Fa>=1?base:base+(T-base)*(F(id,x)-Fa)/(1-Fa);
    let v=Math.max(kg,base+Math.round((raw-base)/j)*j);
    if(v===kg){run++;if(run>3){v=kg+j;run=1;}}else run=1;
    kg=v;
  }
  return Math.round(kg*10)/10;
}

function liftMinutes(d){

  h+=`<div class="sec">Every day</div><div class="card">
  <div class="row ${sd?'done':''}"><input type="checkbox" class="tick" data-task="steps" ${sd?'checked':''} aria-label="20,000 steps done"><div><div class="nm">20,000 steps</div><div class="dt">About ${Math.round(900*bwf())} kcal burned</div></div><div></div></div>`;
  if(dayDiff(d,W1)<0)h+=`<div class="row"><div></div><div><div class="nm">Water starts Monday 5 October</div><div class="dt">3 to 4 litres a day</div></div><div></div></div>`;
  else MEALS.forEach(([id,n])=>{const md=isDone(k,id);h+=`<div class="row ${md?'done':''}"><input type="checkbox" class="tick" data-task="${id}" ${md?'checked':''} aria-label="${esc(n)}"><div class="nm">${esc(n)}</div><div></div></div>`;});
  h+=`</div>`;
  return h;
}

function viewPlan(){
  let h=hero();
  h+=`<h2>Your 13 weeks</h2><p class="muted">Tap any day to open it. A full colour means everything that day is ticked.</p>`;
  const weeks={};ALL.forEach(d=>{(weeks[weekIdx(d)]=weeks[weekIdx(d)]||[]).push(d);});
  Object.keys(weeks).map(Number).sort((a,b)=>a-b).forEach(w=>{
    const ds=weeks[w], mon=w===0?new Date(2026,8,28):addDays(W1,(w-1)*7);
    const c=CARDIO[w], bA=BENCH[w]&&BENCH[w].A;
    h+=`<div class="week"><div class="h"><b>${w===0?'Starter week':'Week '+w}${w===13?', test week':''}</b><span>${mon.getDate()} ${MN[mon.getMonth()]} to ${addDays(mon,6).getDate()} ${MN[addDays(mon,6).getMonth()]}</span></div><div class="days">`;
    for(let i=0;i<7;i++){
      const d=addDays(mon,i);
      if(d<START||d>END){h+=`<div class="dchip empty"></div>`;continue;}
      const t=dayType(d),full=dayPct(d)===1;
      h+=`<button class="dchip ${t!=='R'?'gym':''} ${full?'full':''} ${key(d)===key(TODAY)?'today':''}" style="--c:${TYPES[t].c}" data-day="${key(d)}" aria-label="${fmt(d)}, ${TYPES[t].name}"><div class="dn">${DN[d.getDay()][0]}</div><div class="dd">${d.getDate()}</div><div class="dt">${t==='R'?'':isLeg(t)?'Leg':t==='T'?'Test':t}</div></button>`;
    }
    h+=`</div><div class="wk-info">Cardio: ${esc(c[0])}${bA?'. Heavy single: '+r25(bA.top*S.settings.oneRM/70)+' kg':w===13?'. Bench test Mon 28 Dec':''}</div></div>`;
  });
  h+=`<h2>Rules</h2><div class="card"><ul class="plain">
  <li>Complete every bench rep, then move on to next week's numbers.</li>
  <li>Miss reps and you repeat that week. Miss the same week twice, drop 5 kg and build back up.</li>
  <li>On everything else, when you hit the top reps on every set, go up next session.</li>
  <li>Hit every rep on every set and the weight goes up as planned. Miss reps and stay at that weight.</li>
  <li>Bench rest: 3 min heavy, 2 min volume, 2.5 min paused. Other lifts: 90s for big moves, 60s for small ones.</li></ul></div>`;
  return h;
}

function viewWeights(){
  const s=S.settings; let h=`<h2 style="margin-top:6px">Your numbers</h2><p class="muted">Change these and the whole plan updates.</p><div class="card">
  <div class="field"><label for="f1">Current bench 1 rep max<span class="hint">Your best single, in kg</span></label><input id="f1" type="number" inputmode="decimal" step="2.5" data-set="oneRM" value="${s.oneRM}"></div>
  <div class="field"><label for="f2">Test day target<span class="hint">Your goal on Mon 28 Dec</span></label><input id="f2" type="number" inputmode="decimal" step="2.5" data-set="target" value="${s.target}"></div>
  <div class="field"><label for="f3">Bodyweight<span class="hint">Used for calorie estimates</span></label><input id="f3" type="number" inputmode="decimal" step="0.5" data-set="bw" value="${s.bw}"></div></div>`;

  h+=`<h2>Bench plan</h2><div class="scroll"><table class="bt"><thead><tr><th>Week of</th><th class="num">Mon heavy</th><th class="num">Wed volume</th><th class="num">Fri paused</th></tr></thead><tbody>`;
  const sc1=s.oneRM/70;
  for(let w=0;w<=13;w++){
    const r=BENCH[w]||{}; const mon=w===0?new Date(2026,9,3):addDays(W1,(w-1)*7);
    const sc=x=>Math.max(20,r25(x*sc1)), sets=x=>x.sets+'×'+x.reps+' @ '+sc(x.kg);
    let A=r.A?sc(r.A.top)+'×1, then '+sets(r.A):'', B=r.B?sets(r.B):'', C=r.C?sets(r.C):'';
    if(w===12)A='<b>Benchmark</b> '+A;
    if(w===13)A='<b>Test</b> '+r25(s.target)+'×1';
    if(w===0)C+=' (Sat practice)';
    h+=`<tr><td>${mon.getDate()} ${MN[mon.getMonth()]}</td><td class="num">${A}</td><td class="num">${B}</td><td class="num">${C}</td></tr>`;
  }
  h+=`</tbody></table></div><p class="small muted" style="margin-top:8px">Weights in kg. Mon: heavy single, then 3 back-off sets of 3. Full warm-up sets are on each day's page. Test on Mon 28 Dec: ${r25(s.target)} kg.</p>`;

  h+=`<h2>Exercise sheet</h2><p class="muted">Enter the weight you can do for the listed reps with good form. The sheet fills in the rest. Dumbbell weights are per dumbbell.</p>
  <div class="scroll"><table class="sheet"><thead><tr><th>Exercise and start weight</th>`;
  for(let w=0;w<=13;w++){const mon=w===0?START:addDays(W1,(w-1)*7);h+=`<th class="num">${mon.getDate()} ${MN[mon.getMonth()]}</th>`;}
  h+=`</tr></thead><tbody>`;
  ORDER.forEach(id=>{
    const e=EX[id], from=FIRST[id], mon=from===0?START:addDays(W1,(from-1)*7);
    h+=`<tr><td><div class="exn">${esc(e.n)}</div><div class="exm">${KIND[e.k]}, from ${mon.getDate()} ${MN[mon.getMonth()]}</div><input type="number" inputmode="decimal" step="${STEP[e.k]}" data-start="${id}" value="${esc(startOf(id)??'')}" aria-label="Start weight for ${esc(e.n)}" placeholder="kg"></td>`;
    for(let w=0;w<=13;w++){
      const used=USED[id].has(w);
      if(!used){h+=`<td class="num off">–</td>`;continue;}
      // a week you've already lifted shows what you did (bold); later weeks build on it
      const ws=w===0?START:addDays(W1,(w-1)*7); let did=null;
      for(let i=0;i<7;i++){const v=logOf(key(addDays(ws,i)),id);if(v!==null)did=did===null?snap(id,v):Math.max(did,snap(id,v));}
      const p=did!==null?did:planned(id,w,key(ws));
      h+=`<td class="num">${p===null?'?':(did!==null?'<b>'+kgTxt(p)+'</b>':kgTxt(p))}</td>`;
    }
    h+=`</tr>`;
  });
  h+=`</tbody></table></div><p class="small muted" style="margin-top:8px">Bold weeks are what you actually lifted. If you lift more (or less) than planned, enter it on the Today tab and every week after that moves from your new weight.</p>`;
  h+=`<h2>Settings</h2><div class="card">${cloudHTML()}<div class="field"><label>Theme</label><div><button class="btn" data-theme="">Auto</button> <button class="btn" data-theme="light">Light</button> <button class="btn" data-theme="dark">Dark</button></div></div>
  <div class="field"><label>Reset<span class="hint">Clears every tick, weight and setting on this device</span></label><button class="btn danger" data-reset="1">Reset all</button></div></div>`;
  return h;
}

function viewFood(){
  const empty='<div class="card"><p class="muted">Nothing here yet.</p></div>';
  return `<h2 style="margin-top:6px">Daily targets</h2>${empty}<h2>Prep day, step by step</h2>${empty}<h2>Recipes</h2>${empty}<h2>Weekly shopping list</h2>${empty}<h2>Adjusting</h2>${empty}`;
}

function weightChart(){
  const pts=[];ALL.forEach((d,i)=>{const v=parseFloat(S.days[key(d)]&&S.days[key(d)].weight);if(!isNaN(v))pts.push({i,v});});
  if(!pts.length)return `<div class="card"><p class="muted">Log your first morning weight above and your graph starts here.</p></div>`;
  const W=340,H=210,l=36,r=10,t=14,b=28,N=ALL.length-1;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  lo=Math.floor(lo-0.5);hi=Math.ceil(hi+0.5);if(hi-lo<3){hi=lo+3;}
  const x=i=>l+i/N*(W-l-r), y=v=>t+(hi-v)/(hi-lo)*(H-t-b);
  let s='';
  const step=Math.max(1,Math.round((hi-lo)/4));
  for(let v=lo;v<=hi;v+=step){s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;}
  [[0,'Oct'],[31,'Nov'],[61,'Dec']].forEach(([i,m])=>{s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${t}" y2="${H-b}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x(i)+3}" y="${H-b+16}" font-size="11" fill="var(--muted)">${m}</text>`;});
  const tx=x(dayDiff(parseKey(TEST_KEY),START));
  s+=`<line x1="${tx}" x2="${tx}" y1="${t}" y2="${H-b}" stroke="var(--red)" stroke-width="1.5"/><text x="${tx-3}" y="${t+10}" text-anchor="end" font-size="11" fill="var(--red)">Test</text>`;
  const avg=pts.map(p=>{const w=pts.filter(q=>q.i<=p.i&&q.i>p.i-7);return {i:p.i,v:w.reduce((a,c)=>a+c.v,0)/w.length};});
  pts.forEach(p=>s+=`<circle cx="${x(p.i)}" cy="${y(p.v)}" r="3" fill="var(--muted)" opacity=".55"/>`);
  if(avg.length>1)s+=`<path d="${avg.map((p,k)=>(k?'L':'M')+x(p.i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last=avg[avg.length-1];s+=`<circle cx="${x(last.i)}" cy="${y(last.v)}" r="5" fill="var(--blue)"/>`;
  return `<div class="card" style="padding:10px 6px"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Bodyweight graph from October to December">${s}</svg>
  <div class="chips" style="padding:0 8px 4px"><span class="chip"><span style="color:var(--muted)">●</span> Daily weigh-in</span><span class="chip"><span style="color:var(--blue)">━</span> 7-day average</span></div></div>`;
}
function viewBody(){
  const lk=key(TODAY<START?START:(TODAY>END?END:TODAY));
  const pts=ALL.map(d=>parseFloat(S.days[key(d)]&&S.days[key(d)].weight)).filter(v=>!isNaN(v));
  let h=`<h2 style="margin-top:6px">Weigh-in</h2><div class="card"><div class="field"><label for="wi">Morning weight, ${fmt(parseKey(lk))}<span class="hint">Before food, after the toilet</span></label><input id="wi" type="number" inputmode="decimal" step="0.1" data-bw="1" data-bwk="${lk}" value="${esc((S.days[lk]&&S.days[lk].weight)||'')}" placeholder="kg"></div></div>`;
  if(pts.length){
    const first=pts[0],lastv=pts[pts.length-1],recent=pts.slice(-7),a7=recent.reduce((x,y)=>x+y,0)/recent.length,ch=lastv-first;
    h+=`<div class="facts"><div class="fact"><b>${first.toFixed(1)}</b><span>start, kg</span></div><div class="fact"><b>${a7.toFixed(1)}</b><span>7-day average</span></div><div class="fact"><b style="color:${ch<=0?'var(--green)':'var(--red)'}">${ch>0?'+':''}${ch.toFixed(1)}</b><span>change, kg</span></div></div>`;
  }
  h+=`<div class="sec">Your graph <small>daily weight bounces around; watch the blue line</small></div>`+weightChart();
  const weeks={};ALL.forEach(d=>{const v=parseFloat(S.days[key(d)]&&S.days[key(d)].weight);if(!isNaN(v))(weeks[weekIdx(d)]=weeks[weekIdx(d)]||[]).push(v);});
  const ws=Object.keys(weeks).map(Number).sort((a,b)=>a-b);
  if(ws.length){h+=`<h2>Weekly averages</h2><div class="scroll"><table><thead><tr><th>Week</th><th class="num">Average</th><th class="num">Change</th></tr></thead><tbody>`;let prev=null;ws.forEach(w=>{const a=weeks[w].reduce((x,y)=>x+y,0)/weeks[w].length;h+=`<tr><td>${w===0?'Starter week':'Week '+w}</td><td class="num">${a.toFixed(1)} kg</td><td class="num">${prev===null?'':(a-prev>0?'+':'')+(a-prev).toFixed(1)}</td></tr>`;prev=a;});h+=`</tbody></table></div>`;}
  h+=`<p class="small muted" style="margin-top:10px">Aim for the weekly average to drop 0.5 to 1 kg a week. You can also log weight on the Today tab.</p>`;
  return h;
}

function render(){
  const v={today:viewToday,plan:viewPlan,weights:viewWeights,weighin:viewBody,food:viewFood}[TAB];
  document.getElementById('app').innerHTML=v();
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===TAB?'true':'false'));
  if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme');
}
function go(tab){TAB=tab;render();window.scrollTo(0,0);}

document.addEventListener('click',e=>{
  const b=e.target.closest('button,a');if(!b)return;
  if(b.dataset.tab)go(b.dataset.tab);
  else if(b.dataset.nav){const n=addDays(CUR,+b.dataset.nav);if(n>=START&&n<=END){CUR=n;render();}}
  else if(b.dataset.go==='today'){CUR=new Date(TODAY);render();}
  else if(b.dataset.go==='weights')go('weights');
  else if(b.dataset.auth)doAuth(b.dataset.auth);
  else if(b.dataset.day){CUR=parseKey(b.dataset.day);go('today');}
  else if(b.dataset.theme!==undefined){S.theme=b.dataset.theme;save();render();}
  else if(b.dataset.reset){if(confirm('Reset every tick, weight and setting? If you are signed in, this also resets your cloud save.')){const u=S.syncedUser;S=blank();S.syncedUser=u;save();render();}}
});
document.addEventListener('change',e=>{
  const t=e.target,k=key(CUR);
  if(t.dataset.task){
    const ds=dayState(k),task=t.dataset.task;ds.t[task]=t.checked;
    // ticking an exercise with no weight entered records the planned weight, so it becomes your "last" weight
    if(t.checked&&task.startsWith('ex:')){const id=task.slice(3);if(logOf(k,id)===null){const p=planned(id,weekIdx(CUR),k);if(p!==null){ds.log=ds.log||{};ds.log[id]=String(p);}}}
    save();render();
  }
  else if(t.dataset.log){const ds=dayState(k),id=t.dataset.log,v=t.value.trim();ds.log=ds.log||{};if(v===''){delete ds.log[id];if(ALIAS[id])delete ds.log[ALIAS[id]];}else{const x=num(v);if(x!==null){ds.log[id]=String(snap(id,x));t.value=kgTxt(snap(id,x));}}save();}
  else if(t.dataset.bw){const ds=dayState(t.dataset.bwk||k);ds.weight=t.value;save();if(TAB==='weighin')render();}
  else if(t.dataset.start){const v=t.value.trim();if(v==='')delete S.start[t.dataset.start];else if(num(v)!==null)S.start[t.dataset.start]=snap(t.dataset.start,num(v));save();render();}
  else if(t.dataset.set){const v=parseFloat(t.value);if(!isNaN(v)&&v>0){S.settings[t.dataset.set]=v;save();render();}}
});
render();
initCloud();
</script>
</body>
</html>
